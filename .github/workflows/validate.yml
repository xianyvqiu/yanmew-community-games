name: 校验社区投稿
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - id: policy
        run: npm run validate
      - name: 下载并核验固定版本公开开发包
        id: tool
        run: npm run toolchain
      - name: 验证开发包可独立打包模板
        env:
          YANMEW_PLUGIN_CLI: ${{ steps.tool.outputs.cli }}
        run: npm run smoke
      - name: 本地发布链路演练（不请求 GitHub 发布接口）
        env:
          YANMEW_PLUGIN_CLI: ${{ steps.tool.outputs.cli }}
        run: npm run test:publish
      - name: 使用宿主校验器打包全部投稿
        if: steps.policy.outputs.has_games == 'true'
        env:
          YANMEW_PLUGIN_CLI: ${{ steps.tool.outputs.cli }}
        run: npm run pack
