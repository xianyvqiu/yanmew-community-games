name: 发布小游戏
on:
  push:
    tags: ['*/v*']
permissions:
  contents: read
concurrency:
  group: community-game-publish
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 只允许发布已合入 main 的代码
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw '发布提交尚未合入 main' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
      - name: 下载并核验固定版本公开开发包
        id: tool
        run: npm run toolchain
      - name: 打包、发布附件并更新目录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YANMEW_PLUGIN_CLI: ${{ steps.tool.outputs.cli }}
        run: node build/publish.mjs
